[project]
name = "scipal-backend"
version = "0.1.0"
description = "SciPal backend: RAG pipeline for academic papers (FastAPI app, retrieval, indexing)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "aiosqlite>=0.20",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "rank-bm25>=0.2",
    "transformers>=4.45",
    "torch>=2.4",
    "sentence-transformers>=3.1",
    "flagembedding>=1.3",
    "faiss-cpu>=1.8",
    "mineru>=1.1",
    "pymupdf>=1.24",
    "tomli>=2.0 ; python_version < '3.11'",
    "modelscope>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
]

[project.scripts]
scipal-backend = "backend.app.main:app"
scipal-eval = "scipal_eval.cli:main"

[dependency-groups]
eval = [
    "pandas>=2.2",
    "deepeval>=1.0",
    "ragas",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/scipal_eval"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
