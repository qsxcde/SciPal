[project]
name = "scipal-backend"
version = "0.1.0"
description = "SciPal backend: RAG pipeline for academic papers (FastAPI app, retrieval, indexing)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "transformers>=4.45",
    "torch>=2.4",
    "sentence-transformers>=3.1",
    "faiss-cpu>=1.8",
    "mineru>=1.1",
    "pypdf>=5.0",
    "modelscope>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
]

[project.scripts]
scipal-backend = "backend.app.main:main"
scipal-eval = "scipal_eval.cli:main"

[dependency-groups]
eval = [
    "langchain-openai>=0.2",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "ragas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/scipal_eval"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
